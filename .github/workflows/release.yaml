name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Validate final release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable releases require an exact vX.Y.Z tag; got ${RELEASE_TAG}" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.52.0

      - name: Install web dependencies
        run: npm ci
        working-directory: web/ui

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: Build embedded web UI
        run: task web-build

      - name: Run lint
        run: task lint

      - name: Run tests
        run: task test-ci

      - name: Verify CGO-free semantic fallback
        run: CGO_ENABLED=0 go test ./internal/semanticindex -run '^TestRuntimeCapabilityDefault$' -count=1

      - name: Run build
        run: task build

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: amd64
            archive_ext: tar.gz
          - goos: linux
            goarch: amd64
            archive_ext: tar.gz
          - goos: linux
            goarch: arm64
            archive_ext: tar.gz
          - goos: windows
            goarch: amd64
            archive_ext: zip

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa # v2.1.0
        with:
          version: 3.52.0

      - name: Install web dependencies
        run: npm ci
        working-directory: web/ui

      - name: Build embedded web UI
        run: task web-build

      - name: Build release archive
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          ARCHIVE_EXT: ${{ matrix.archive_ext }}
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME}"
          safe_version="$(printf '%s' "${version}" | tr '/' '-')"
          archive_base="dbrain_${safe_version}_${GOOS}_${GOARCH}"
          binary_name="dbrain"

          task build
          test "${CGO_ENABLED}" = "0"
          go version -m bin/dbrain | grep -F "CGO_ENABLED=0"
          if go version -m bin/dbrain | grep -F -- "-tags=usearch"; then
            echo "CGO-free release artifact unexpectedly carries the usearch build tag" >&2
            exit 1
          fi

          if [ "${GOOS}" = "windows" ]; then
            binary_name="${binary_name}.exe"
          fi

          package_dir="dist/${archive_base}"
          mkdir -p "${package_dir}"
          cp bin/dbrain "${package_dir}/${binary_name}"
          cp README.md LICENSE "${package_dir}/"
          cp third_party/usearch/LICENSE "${package_dir}/LICENSE-USearch"
          if [ -f THIRD_PARTY_NOTICES.md ]; then
            cp THIRD_PARTY_NOTICES.md "${package_dir}/"
          fi

          if [ "${ARCHIVE_EXT}" = "zip" ]; then
            (
              cd dist
              zip -r "${archive_base}.zip" "${archive_base}"
            )
          else
            tar -C dist -czf "dist/${archive_base}.tar.gz" "${archive_base}"
          fi

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/dbrain_*_${{ matrix.goos }}_${{ matrix.goarch }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  build-darwin-arm64-native:
    name: Build darwin/arm64 with native semantic ANN
    runs-on: macos-15
    needs: verify

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Install Task
        uses: go-task/setup-task@01a4adf9db2d14c1de7a560f09170b6e0df736aa
        with:
          version: 3.52.0

      - name: Install web dependencies
        run: npm ci
        working-directory: web/ui

      - name: Build embedded web UI
        run: task web-build

      - name: Build pinned static USearch
        run: task usearch-static-darwin-arm64

      - name: Run tagged native tests
        run: task test-usearch-darwin-arm64

      - name: Build tagged native binary
        run: task build-usearch-darwin-arm64
        env:
          DBRAIN_RELEASE_VERSION: ${{ github.ref_name }}

      - name: Verify native artifact
        run: task verify-usearch-darwin-arm64

      - name: Build native release archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          safe_version="$(printf '%s' "${version}" | tr '/' '-')"
          archive_base="dbrain_${safe_version}_darwin_arm64"
          package_dir="dist/${archive_base}"
          mkdir -p "${package_dir}"
          cp bin/dbrain "${package_dir}/dbrain"
          cp README.md LICENSE THIRD_PARTY_NOTICES.md "${package_dir}/"
          cp third_party/usearch/LICENSE "${package_dir}/LICENSE-USearch"
          tar -C dist -czf "dist/${archive_base}.tar.gz" "${archive_base}"

      - name: Upload native archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: cli-darwin-arm64
          path: dist/dbrain_*_darwin_arm64.tar.gz
          if-no-files-found: error

  publish:
    name: Publish release assets
    runs-on: ubuntu-latest
    needs: [build, build-darwin-arm64-native]
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          pattern: cli-*
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum dbrain_* > dbrain_checksums.txt

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          shopt -s nullglob
          files=(dist/dbrain_*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no release files matched dist/dbrain_*" >&2
            exit 1
          fi

          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi

          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --repo "${GITHUB_REPOSITORY}" --clobber

  update-homebrew-tap:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: publish
    concurrency:
      group: dbrain-homebrew-tap-update
      cancel-in-progress: false
      queue: max
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAP_REPOSITORY: darron/homebrew-tap
      TAP_FORMULA_PATH: Formula/dbrain.rb

    steps:
      - name: Require Homebrew tap token
        run: |
          set -euo pipefail
          test -n "${HOMEBREW_TAP_TOKEN}"

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: dist
          pattern: cli-*
          merge-multiple: true

      - name: Check out Homebrew tap
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          token: ${{ env.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        shell: bash
        run: |
          set -euo pipefail

          version_tag="${GITHUB_REF_NAME}"
          version="${version_tag#v}"
          release_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${version_tag}"

          declare -A checksums
          for target in darwin_amd64 darwin_arm64 linux_amd64 linux_arm64; do
            archive="dist/dbrain_${version_tag}_${target}.tar.gz"
            if [ ! -f "${archive}" ]; then
              echo "missing release archive: ${archive}" >&2
              exit 1
            fi
            checksums["${target}"]="$(sha256sum "${archive}" | awk '{print $1}')"
          done

          export VERSION="${version}"
          export VERSION_TAG="${version_tag}"
          export RELEASE_BASE="${release_base}"
          export DARWIN_AMD64_SHA="${checksums[darwin_amd64]}"
          export DARWIN_ARM64_SHA="${checksums[darwin_arm64]}"
          export LINUX_AMD64_SHA="${checksums[linux_amd64]}"
          export LINUX_ARM64_SHA="${checksums[linux_arm64]}"

          ruby <<'RUBY'
          formula_path = File.join("homebrew-tap", ENV.fetch("TAP_FORMULA_PATH"))
          text = File.read(formula_path)
          text = text.gsub(/^[ \t]*conflicts_with[ \t]+"dbrain-test"(?:,[^\n]*)?\n(?:\n)?/, "")
          text = text.gsub(/^[ \t]*version[ \t]+"[^"]+"\n(?:\n)?/, "")
          if text.match?(/^  license "MIT"\s*$/)
            text = text.sub(/^  license "MIT"\s*$/, '  license all_of: ["MIT", "Apache-2.0"]')
          end
          unless text.include?('license all_of: ["MIT", "Apache-2.0"]')
            abort("stable formula license is not the required MIT and Apache-2.0 conjunction")
          end
          unless text.include?('pkgshare.install "THIRD_PARTY_NOTICES.md", "LICENSE-USearch"')
            install = text.match(/^(\s+bin\.install "dbrain"\s*)$/)
            abort("stable formula is missing its binary install anchor") unless install
            text = text.sub(
              install[0],
              "#{install[0]}\n    pkgshare.install \"THIRD_PARTY_NOTICES.md\", \"LICENSE-USearch\"",
            )
          end
          unless text.include?('semantic status --json')
            test_end = text.match(/\n  end\nend\s*\z/)
            abort("stable formula is missing its test block terminator") unless test_end
            semantic_test = <<~'RUBY_TEST'.chomp

                status = shell_output(
                  "#{bin}/dbrain --root #{testpath}/dbrain --no-debug semantic status --json",
                )
                if OS.mac? && Hardware::CPU.arm?
                  assert_match '"state": "supported_ready"', status
                  assert_match '"backend": "usearch"', status
                  assert_match '"version": "2.26.0"', status
                else
                  assert_match '"state": "unsupported"', status
                end
            RUBY_TEST
            semantic_test = "\n" + semantic_test.lines.map { |line| "    #{line}" }.join.chomp
            text = text.sub(test_end[0], "#{semantic_test}#{test_end[0]}")
          end
          version_tag = ENV.fetch("VERSION_TAG")
          release_base = ENV.fetch("RELEASE_BASE")
          targets = {
            "darwin_amd64" => ENV.fetch("DARWIN_AMD64_SHA"),
            "darwin_arm64" => ENV.fetch("DARWIN_ARM64_SHA"),
            "linux_amd64" => ENV.fetch("LINUX_AMD64_SHA"),
            "linux_arm64" => ENV.fetch("LINUX_ARM64_SHA"),
          }

          targets.each do |target, sha|
            os, arch = target.split("_", 2)
            filename = "dbrain_#{version_tag}_#{os}_#{arch}.tar.gz"
            url = "#{release_base}/#{filename}"

            text = text.gsub(/https:\/\/github\.com\/[^"]*\/releases\/download\/v[^"]*\/dbrain_v[^"]*_#{os}_#{arch}\.tar\.gz/, url)
            text = text.gsub(/dbrain_v[^"\/]*_#{os}_#{arch}\.tar\.gz/, filename)
            text = text.gsub(
              /(url\s+"[^"]*dbrain_[^"]*_#{os}_#{arch}\.tar\.gz"\n\s*)sha256\s+"[a-fA-F0-9]+"/,
              "\\1sha256 \"#{sha}\"",
            )

            unless text.include?(url) && text.include?(sha)
              abort("formula update did not find #{target} URL/checksum slots")
            end
          end

          File.write(formula_path, text)
          RUBY

      - name: Commit and push tap update
        shell: bash
        run: |
          set -euo pipefail
          cd homebrew-tap
          if git diff --quiet -- "${TAP_FORMULA_PATH}"; then
            echo "Homebrew formula is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${TAP_FORMULA_PATH}"
          git commit -m "Update dbrain to ${GITHUB_REF_NAME}"
          git push

  homebrew-smoke:
    name: Verify installed stable Homebrew artifact
    runs-on: macos-15
    needs: update-homebrew-tap

    steps:
      - name: Install and test stable formula
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install darron/tap/dbrain
          brew test darron/tap/dbrain
          binary="$(brew --prefix dbrain)/bin/dbrain"
          if otool -L "${binary}" | grep -Eiq 'libusearch[^/]*\.(dylib|so)'; then
            echo "installed dbrain has an external USearch dynamic-library dependency" >&2
            exit 1
          fi
          status="$("${binary}" --root "${RUNNER_TEMP}/dbrain-homebrew-smoke" --no-debug semantic status --json)"
          grep -F '"state": "supported_ready"' <<<"${status}"
          grep -F '"backend": "usearch"' <<<"${status}"
          grep -F '"version": "2.26.0"' <<<"${status}"
