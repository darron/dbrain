version: "3"

vars:
  GOCACHE: "{{.ROOT_DIR}}/.gocache"
  GOMODCACHE: "{{.ROOT_DIR}}/.gomodcache"
  GIT_VERSION:
    sh: git --version 2>/dev/null | sed 's/git version //' || echo unknown
  BUILD_PLATFORM:
    sh: printf "%s/%s" "$(go env GOOS)" "$(go env GOARCH)"

tasks:
  build:
    desc: Build the dbrain CLI
    cmds:
      - mkdir -p bin
      - GOCACHE={{.GOCACHE}} GOMODCACHE={{.GOMODCACHE}} go build -buildvcs=true -ldflags "-X dbrain/internal/version.GitVersion={{.GIT_VERSION}} -X dbrain/internal/version.BuildPlatform={{.BUILD_PLATFORM}}" -o ./bin/dbrain ./cmd/dbrain

  fmt:
    desc: Format Go source files
    cmds:
      - GOCACHE={{.GOCACHE}} GOMODCACHE={{.GOMODCACHE}} go fmt ./...

  web-install:
    desc: Install the web UI dependencies
    cmds:
      - cd web/ui && npm install

  web-build:
    desc: Build the embedded web UI assets
    cmds:
      - cd web/ui && npm run build

  lint:
    desc: Run golangci-lint
    cmds:
      - GOCACHE={{.GOCACHE}} GOMODCACHE={{.GOMODCACHE}} golangci-lint run ./...

  test:
    desc: Run the Go test suite
    cmds:
      - GOCACHE={{.GOCACHE}} GOMODCACHE={{.GOMODCACHE}} go test ./...

  test-mcp:
    desc: Run deterministic MCP retrieval and server tests
    cmds:
      - GOCACHE={{.GOCACHE}} GOMODCACHE={{.GOMODCACHE}} go test ./internal/ask ./internal/mcpeval ./internal/mcpserver
