<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">dbrain local-first evidence system</title>
  <desc id="desc">Architecture diagram showing import-only sources flowing into local SQLite, vault Markdown, media, search, tags, backlinks, and OKF export; enrichment workers and local or hosted models operate over the local store; CLI, web, MCP, Tailscale, launchd, and archive surfaces use the same evidence.</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121315"/>
      <stop offset="0.48" stop-color="#18191d"/>
      <stop offset="1" stop-color="#101419"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24272c"/>
      <stop offset="1" stop-color="#171a1f"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19242a"/>
      <stop offset="0.5" stop-color="#14191e"/>
      <stop offset="1" stop-color="#101316"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#0284c7" stop-opacity="0.09"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#86efac" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fde047" stop-opacity="0.27"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="rose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fda4af" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e11d48" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-18%" width="124%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#22d3ee" flood-opacity="0.25"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#e7edf7" stroke-width="0.5" opacity="0.035"/>
      <circle cx="0" cy="0" r="1.1" fill="#e7edf7" opacity="0.055"/>
    </pattern>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5eead4"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#facc15"/>
    </marker>
    <style>
      text {
        font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }
      .eyebrow {
        fill: #facc15;
        font-size: 17px;
        font-weight: 820;
        text-transform: uppercase;
      }
      .title {
        fill: #f8fafc;
        font-size: 52px;
        font-weight: 850;
      }
      .subtitle {
        fill: #b8c5d6;
        font-size: 21px;
        font-weight: 540;
      }
      .section {
        fill: #f8fafc;
        font-size: 21px;
        font-weight: 820;
      }
      .label {
        fill: #eef4ff;
        font-size: 16px;
        font-weight: 760;
      }
      .small {
        fill: #b7c4d6;
        font-size: 13.5px;
        font-weight: 560;
      }
      .tiny {
        fill: #9daabd;
        font-size: 12px;
        font-weight: 560;
      }
      .coreTitle {
        fill: #f9fafb;
        font-size: 27px;
        font-weight: 850;
      }
      .coreText {
        fill: #d5e1ef;
        font-size: 15px;
        font-weight: 610;
      }
      .muted {
        fill: #94a3b8;
        font-size: 12.5px;
        font-weight: 560;
      }
      .line {
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .hairline {
        stroke: #66758a;
        stroke-width: 1;
        stroke-opacity: 0.42;
      }
    </style>
  </defs>

  <rect width="1600" height="720" fill="url(#pageBg)"/>
  <rect width="1600" height="720" fill="url(#grid)"/>
  <ellipse cx="800" cy="368" rx="540" ry="292" fill="#22d3ee" opacity="0.035"/>
  <ellipse cx="800" cy="365" rx="348" ry="186" fill="#86efac" opacity="0.03"/>

  <text x="52" y="56" class="eyebrow">local-first second brain</text>
  <text x="52" y="111" class="title">dbrain</text>
  <text x="52" y="146" class="subtitle">Local evidence. Model-assisted research.</text>

  <g transform="translate(48 178)" filter="url(#shadow)">
    <rect width="360" height="432" rx="18" fill="url(#panel)" stroke="#65758a" stroke-opacity="0.46"/>
    <text x="24" y="38" class="section">Import-only sources</text>
    <text x="24" y="64" class="small">Upstream apps are read, never owned.</text>

    <g transform="translate(24 91)">
      <rect width="148" height="50" rx="12" fill="url(#amber)" stroke="#facc15" stroke-opacity="0.46"/>
      <text x="15" y="22" class="label">X bookmarks</text>
      <text x="15" y="39" class="tiny">quotes, links, media</text>
    </g>
    <g transform="translate(188 91)">
      <rect width="148" height="50" rx="12" fill="url(#blue)" stroke="#22d3ee" stroke-opacity="0.44"/>
      <text x="15" y="22" class="label">Apple Notes</text>
      <text x="15" y="39" class="tiny">snapshot SQLite</text>
    </g>
    <g transform="translate(24 157)">
      <rect width="148" height="50" rx="12" fill="url(#blue)" stroke="#22d3ee" stroke-opacity="0.36"/>
      <text x="15" y="22" class="label">Safari tabs</text>
      <text x="15" y="39" class="tiny">device-scoped tabs</text>
    </g>
    <g transform="translate(188 157)">
      <rect width="148" height="50" rx="12" fill="url(#green)" stroke="#86efac" stroke-opacity="0.38"/>
      <text x="15" y="22" class="label">GitHub stars</text>
      <text x="15" y="39" class="tiny">repos + READMEs</text>
    </g>
    <g transform="translate(24 223)">
      <rect width="148" height="50" rx="12" fill="url(#rose)" stroke="#fda4af" stroke-opacity="0.34"/>
      <text x="15" y="22" class="label">YouTube</text>
      <text x="15" y="39" class="tiny">liked + watch later</text>
    </g>
    <g transform="translate(188 223)">
      <rect width="148" height="50" rx="12" fill="url(#green)" stroke="#86efac" stroke-opacity="0.34"/>
      <text x="15" y="22" class="label">RSS / Atom</text>
      <text x="15" y="39" class="tiny">feeds + JSON Feed</text>
    </g>
    <g transform="translate(24 289)">
      <rect width="148" height="50" rx="12" fill="url(#amber)" stroke="#facc15" stroke-opacity="0.32"/>
      <text x="15" y="22" class="label">Browser save</text>
      <text x="15" y="39" class="tiny">Chrome + Safari</text>
    </g>
    <g transform="translate(188 289)">
      <rect width="148" height="50" rx="12" fill="url(#blue)" stroke="#22d3ee" stroke-opacity="0.34"/>
      <text x="15" y="22" class="label">Manual URLs</text>
      <text x="15" y="39" class="tiny">link add + enrich</text>
    </g>

    <path d="M24 373 H336" class="hairline"/>
    <text x="24" y="398" class="tiny">Append-only by default. Raw extracts, OCR,</text>
    <text x="24" y="416" class="tiny">transcripts, and source JSON stay available.</text>
  </g>

  <path class="line" d="M408 392 C434 392 438 392 456 392" stroke="#5eead4" stroke-opacity="0.78" marker-end="url(#arrowCyan)"/>

  <g transform="translate(456 94)" filter="url(#shadow)">
    <rect width="688" height="118" rx="18" fill="url(#panel)" stroke="#65758a" stroke-opacity="0.38"/>
    <text x="24" y="37" class="section">Enrichment and model lanes</text>
    <text x="24" y="65" class="small">Hydrate X, discover links, extract sources, summarize, OCR, transcribe, categorize, index topics and entities.</text>
    <text x="24" y="92" class="small">Backends: Ollama, LM Studio, oMLX, OpenRouter, OpenAI-compatible aliases, MacWhisper, yt-dlp, tesseract.</text>
  </g>

  <path class="line" d="M800 212 C800 232 800 246 800 263" stroke="#facc15" stroke-opacity="0.68" marker-end="url(#arrowAmber)"/>

  <g transform="translate(456 260)" filter="url(#shadow)">
    <rect width="688" height="272" rx="22" fill="url(#core)" stroke="#5eead4" stroke-opacity="0.48" filter="url(#softGlow)"/>
    <text x="344" y="43" text-anchor="middle" class="coreTitle">Local authority</text>
    <text x="344" y="71" text-anchor="middle" class="coreText">SQLite is the working truth. Markdown is the human surface.</text>

    <g transform="translate(40 104)">
      <rect width="184" height="58" rx="13" fill="#172027" stroke="#5eead4" stroke-opacity="0.42"/>
      <text x="18" y="24" class="label">brain.db</text>
      <text x="18" y="43" class="tiny">items, sources, failures</text>
    </g>
    <g transform="translate(252 104)">
      <rect width="184" height="58" rx="13" fill="#191f20" stroke="#facc15" stroke-opacity="0.4"/>
      <text x="18" y="24" class="label">Vault notes</text>
      <text x="18" y="43" class="tiny">rendered Markdown</text>
    </g>
    <g transform="translate(464 104)">
      <rect width="184" height="58" rx="13" fill="#17221c" stroke="#86efac" stroke-opacity="0.38"/>
      <text x="18" y="24" class="label">Media store</text>
      <text x="18" y="43" class="tiny">content-addressed files</text>
    </g>
    <g transform="translate(40 184)">
      <rect width="184" height="58" rx="13" fill="#191d23" stroke="#fda4af" stroke-opacity="0.34"/>
      <text x="18" y="24" class="label">Search fabric</text>
      <text x="18" y="43" class="tiny">FTS, excerpts, windows</text>
    </g>
    <g transform="translate(252 184)">
      <rect width="184" height="58" rx="13" fill="#171f25" stroke="#22d3ee" stroke-opacity="0.38"/>
      <text x="18" y="24" class="label">Evidence graph</text>
      <text x="18" y="43" class="tiny">backlinks, quotes, tags</text>
    </g>
    <g transform="translate(464 184)">
      <rect width="184" height="58" rx="13" fill="#191f20" stroke="#facc15" stroke-opacity="0.34"/>
      <text x="18" y="24" class="label">OKF snapshot</text>
      <text x="18" y="43" class="tiny">private export bundle</text>
    </g>
  </g>

  <path class="line" d="M1144 392 C1168 392 1172 392 1192 392" stroke="#5eead4" stroke-opacity="0.78" marker-end="url(#arrowCyan)"/>

  <g transform="translate(1192 178)" filter="url(#shadow)">
    <rect width="360" height="432" rx="18" fill="url(#panel)" stroke="#65758a" stroke-opacity="0.46"/>
    <text x="24" y="38" class="section">Use and operate</text>
    <text x="24" y="64" class="small">Every surface reads the same local evidence.</text>

    <g transform="translate(24 91)">
      <rect width="148" height="50" rx="12" fill="url(#blue)" stroke="#22d3ee" stroke-opacity="0.42"/>
      <text x="15" y="22" class="label">Web + Chat</text>
      <text x="15" y="39" class="tiny">research harness</text>
    </g>
    <g transform="translate(188 91)">
      <rect width="148" height="50" rx="12" fill="url(#green)" stroke="#86efac" stroke-opacity="0.36"/>
      <text x="15" y="22" class="label">CLI + tasks</text>
      <text x="15" y="39" class="tiny">sync, stats, repair</text>
    </g>
    <g transform="translate(24 157)">
      <rect width="148" height="50" rx="12" fill="url(#amber)" stroke="#facc15" stroke-opacity="0.36"/>
      <text x="15" y="22" class="label">MCP</text>
      <text x="15" y="39" class="tiny">read-only tools</text>
    </g>
    <g transform="translate(188 157)">
      <rect width="148" height="50" rx="12" fill="url(#rose)" stroke="#fda4af" stroke-opacity="0.34"/>
      <text x="15" y="22" class="label">What changed</text>
      <text x="15" y="39" class="tiny">whats-new review</text>
    </g>
    <g transform="translate(24 223)">
      <rect width="148" height="50" rx="12" fill="url(#green)" stroke="#86efac" stroke-opacity="0.34"/>
      <text x="15" y="22" class="label">Tailscale</text>
      <text x="15" y="39" class="tiny">web/MCP remote</text>
    </g>
    <g transform="translate(188 223)">
      <rect width="148" height="50" rx="12" fill="url(#blue)" stroke="#22d3ee" stroke-opacity="0.34"/>
      <text x="15" y="22" class="label">Launchd</text>
      <text x="15" y="39" class="tiny">scheduled sync all</text>
    </g>
    <g transform="translate(24 289)">
      <rect width="148" height="50" rx="12" fill="url(#amber)" stroke="#facc15" stroke-opacity="0.32"/>
      <text x="15" y="22" class="label">Archive</text>
      <text x="15" y="39" class="tiny">S3/R2 + restore</text>
    </g>
    <g transform="translate(188 289)">
      <rect width="148" height="50" rx="12" fill="url(#rose)" stroke="#fda4af" stroke-opacity="0.32"/>
      <text x="15" y="22" class="label">Auth gates</text>
      <text x="15" y="39" class="tiny">GitHub + MCP tokens</text>
    </g>

    <path d="M24 373 H336" class="hairline"/>
    <text x="24" y="398" class="tiny">Web is a trusted read/write admin surface.</text>
    <text x="24" y="416" class="tiny">MCP and OKF inspection remain read-only.</text>
  </g>

  <g transform="translate(456 568)">
    <rect width="688" height="72" rx="24" fill="#14181d" stroke="#65758a" stroke-opacity="0.36"/>
    <circle cx="34" cy="36" r="8" fill="#86efac"/>
    <text x="56" y="30" class="small">Local-first contract: the database, vault, and media remain authoritative working state.</text>
    <text x="56" y="51" class="tiny">Remote services are import, inference, access, or durability lanes, not the primary source of truth.</text>
  </g>
</svg>
